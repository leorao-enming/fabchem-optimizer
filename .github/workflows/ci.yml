name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (no IDAES binary extensions in this fast PR gate)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Validation smoke
        run: python scripts/validate.py

  make-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Makefile smoke (setup + test + validate)
        run: |
          make setup
          make test
          make validate
        # make validate is a schema-fixture stub at P0 — no IDAES/IPOPT solve
        # happens here. Solver-dependent validation (IDAES extensions, IPOPT
        # smoke test, full `make cases`) runs nightly/manual in Docker per
        # section 3.4 of the Overview doc, not in this job — added once C1 lands.
